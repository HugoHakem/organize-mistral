[project]
name = "organize-mistral"
version = "0.1.0"
description = "Turn Mistral OCR exports into stable, self-contained Markdown files with copied images."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
organize-mistral-extract = "organize_mistral.organize_mistral_extract:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/organize_mistral"]

[tool.pytest.ini_options]
testpaths = ["tests"]
